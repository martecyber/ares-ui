name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm test run
      - run: pnpm run build

      # Intermediate version = whatever is committed in package.json's "version", plus the short
      # commit hash as SemVer build metadata — never rewrites the committed package.json. Docker
      # tags can't contain "+", so the image tag sanitizes it to a second hyphen.
      - name: Compute intermediate version
        id: ver
        run: |
          set -euo pipefail
          BASE="$(node -p "require('./package.json').version")"
          SHA="${GITHUB_SHA:0:7}"
          echo "version=${BASE}+${SHA}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${BASE}-${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.multistage
          push: true
          tags: |
            ghcr.io/martecyber/ares-ui:${{ steps.ver.outputs.docker_tag }}
            ghcr.io/martecyber/ares-ui:main
