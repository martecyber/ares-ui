name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options: [release, rc, beta, alpha]
      base_version:
        description: "Override MAJOR.MINOR.PATCH (blank = keep current)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tags are the source of truth for "next N" per channel — no separate counter file.
      - name: Compute release version
        id: ver
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').version")"
          MMP="${{ inputs.base_version }}"
          if [ -z "$MMP" ]; then
            MMP="$(echo "$CURRENT" | sed -E 's/-.*$//')"
          fi
          CHANNEL="${{ inputs.channel }}"
          if [ "$CHANNEL" = "release" ]; then
            VERSION="$MMP"
            TAG="v${MMP}"
          else
            PREFIX="v${MMP}-${CHANNEL}"
            LAST="$(git tag -l "${PREFIX}*" | sed -E "s/^${PREFIX}//" | sort -n | tail -1)"
            NEXT=$(( ${LAST:-0} + 1 ))
            VERSION="${MMP}-${CHANNEL}${NEXT}"
            TAG="${PREFIX}${NEXT}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/martecyber/ares-ui:${VERSION}"
            if [ "$CHANNEL" = "release" ]; then echo "ghcr.io/martecyber/ares-ui:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump package.json, commit, and tag
        run: |
          set -euo pipefail
          npm pkg set version="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${{ steps.ver.outputs.tag }}"
          else
            echo "package.json already at ${{ steps.ver.outputs.version }} — tagging current HEAD without a new commit"
          fi
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin HEAD:main "${{ steps.ver.outputs.tag }}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.multistage
          push: true
          tags: ${{ steps.ver.outputs.tags }}
