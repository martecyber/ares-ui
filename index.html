<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet" />
    <title>Ares · Console</title>
    <script>
      // Pre-paint theme bootstrap: read the operator's stored preference and apply
      // it to <html data-theme> before any CSS evaluates, avoiding a dark→light flash.
      // Default is dark to match historical behavior. Anything other than "light"
      // collapses to "dark" so an unknown value can't leave the app un-styled.
      (function () {
        try {
          var t = localStorage.getItem('ares-theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) { /* localStorage blocked — keep the hardcoded dark default. */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
