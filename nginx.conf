server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving ares-api lazily (per-request, via the $upstream_api
    # variable below) rather than once at startup means nginx still starts and serves the
    # SPA even if ares-api isn't up yet or isn't resolvable — only /api/ requests fail (502)
    # until it becomes reachable, instead of the whole container refusing to start.
    resolver 127.0.0.11 valid=10s;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Aggressive caching for hashed assets (Vite outputs them as assets/xxx.hash.js)
    # Anchored to ^/assets/ so it does NOT match /api/v1/assets/...
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for index.html so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API proxy — forwards to ares-api container
    location /api/ {
        set $upstream_api http://ares-api:8888;
        proxy_pass         $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Kept above apiClient's own 100s axios timeout (see ares-ui/src/api/client.ts) so a
        # genuinely slow AQL query times out cleanly on the client first, instead of nginx cutting
        # the connection out from under it with a 504.
        proxy_read_timeout 180s;
        client_max_body_size 1g;
    }

    # Swagger UI / OpenAPI spec — public on ares-api itself (see SecurityConfig's permitAll for
    # these same three patterns) but otherwise only reachable directly on the backend's own port;
    # proxied here too so the topbar's "API Reference" link resolves through the same public
    # origin as the rest of the app, not a host/port a browser outside the deploy network can't
    # reach. Mirrors the /api/ block above exactly.
    location ~ ^/(v3/api-docs(\.yaml)?|swagger-ui)(/|$) {
        set $upstream_api http://ares-api:8888;
        proxy_pass         $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /swagger-ui.html {
        set $upstream_api http://ares-api:8888;
        proxy_pass         $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all non-asset routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
